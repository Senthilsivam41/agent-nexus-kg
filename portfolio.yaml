schemaVersion: portfolio.dev/v1
kind: Product
metadata:
  id: scale-kg
  name: Agent Nexus KG
  description: Distributed, engine-agnostic semantic knowledge graph platform (100M–10B+ edges) with pluggable GraphStore adapters for multi-hop Kinetic-V GraphRAG.
  stage: lab
  owners:
    - sendil
spec:
  standalone: true
  category: retrieval
  runtimes: {}
  commands:
    setup: make setup
    demo: make demo
    dev: make dev
    check: make check
  services: []
  interfaces:
    rest:
      protocol: http
      entrypoint: scale_kg.api.app:create_app
      health: /v1/health
      endpoints:
        - /v1/ingest
        - /v1/traverse
        - /v1/hybrid-retrieve
        - /v1/benchmark/run
        - /v1/nodes/{node_id}
        - /v1/nodes/{node_id}/neighbors
        - /v1/stats
        - /v1/lakehouse/documents
        - /v1/lakehouse/slices
        - /v1/directory/aliases
        - /v1/directory/resolve/{entity_id}
        - /showcase
        - /showcase/api/snapshot
    grpc:
      protocol: grpc
      proto: src/scale_kg/api/scale_kg.proto
      service: scale_kg.v1.ScaleKGService
      bridge: /scale_kg.v1.ScaleKGService/{rpc_method}
  integrations:
    consumes: []
    produces: []
  docs:
    quickstart: docs/quickstart.md
    architecture: docs/architecture.md
    configuration: docs/configuration.md

